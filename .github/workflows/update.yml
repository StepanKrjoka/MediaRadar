name: Оновлення стрічки

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні 10 хв (GitHub може запускати із затримкою)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуску
  push:
    paths:
      - "config/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Встановити бібліотеки
        run: pip install feedparser requests PyYAML deep-translator

      - name: Зібрати новини
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}   # необов'язково: ключ DeepL API Free
        run: python scripts/fetch.py

      - name: Зберегти дані
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Оновлення стрічки $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X theirs || true
            git push
          fi
