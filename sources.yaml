# ===========================================================
#  Radar — налаштування джерел
#  Додати джерело: допишіть блок у feeds (name, url, tab).
#  Будь-яке джерело можна вимкнути: enabled: false
# ===========================================================

# Скільки годин тримати новини у стрічці
retention_hours: 72

# Вкладки за джерелами. Порядок тут = порядок вкладок на сторінці.
# Окрім них сторінка завжди має вкладки «Усі» та «Важливе».
tabs:
  - id: world
    title: Світ
  - id: ukraine
    title: Україна
  - id: mine
    title: Мої джерела

# Теми для фільтра «За темами».
# Слово із * на кінці — це корінь: «нафт*» знайде «нафта», «нафтовий», «нафтогаз».
# Слово без * шукається цілим словом: «oil» не спрацює на «soil».
topics:
  - id: oil
    title: Нафта і пальне
    keywords: [oil, crude, brent, wti, diesel, gasoline, petrol, jet fuel, fuel*, refin*, opec*, "нафт*", "пальн*", "паливн*", "бензин*", "дизел*", "азс", "нпз", "автогаз*", "скраплен*", "укрнафт*", "okko", "wog", "socar"]
  - id: gas
    title: Газ
    keywords: [gas, lng, ttf, "henry hub", pipeline*, "газ", "газу", "газом", "газов*", "нафтогаз*", "гтс", "пхг", "оператор гтс", "зпг"]
  - id: power
    title: Електроенергія
    keywords: [electricity, "power grid", "power price*", "power market", nuclear, coal, utility, utilities, blackout*, "електроенерг*", "енергосистем*", "укренерго", "аес", "тес", "тец", "енергоатом*", "відключен*", "генерац*", "ринок на добу наперед", "рдн", "енергетик*", "дтек", "центренерго", "укргідроенерго"]
  - id: renewables
    title: ВДЕ і накопичення
    keywords: [solar, "wind farm*", "wind power", "offshore wind", renewable*, "battery storage", bess, hydrogen, biomethane, photovoltaic, "сонячн*", "вітров*", "вде", "накопичувач*", "водн*", "біометан*", "зелен* тариф*", "гарантован* покуп*", "епс", "epc"]
  - id: logistics
    title: Логістика
    keywords: [shipping, freight, container*, tanker*, port, ports, rail*, trucking, logistics, "supply chain", "red sea", "suez", "black sea", "порт", "порти", "портів", "портах", "логіст*", "вантаж*", "залізниц*", "укрзалізниц*", "фрахт*", "контейнер*", "коридор*", "пункт* пропуску", "черг* на кордоні", "перевез*", "суден", "судна"]
  - id: industry
    title: Промисловість
    keywords: [steel, metallurg*, "iron ore", mining, manufactur*, chemical*, fertili*, aluminium, aluminum, "металург*", "сталь", "сталі", "руд*", "гмк", "шахт*", "завод*", "виробництв*", "промислов*", "хімі*", "добрив*", "метінвест*", "арселор*", "фероспла*", "цемент*"]

# Що позначати як «Важливе», крім новин, які одночасно дали 2+ джерела
important:
  min_sources: 2
  keywords: [breaking, exclusive, urgent, "терміново", "блискавка", "ексклюзив*", "опек+ ухвал*", "opec+ agrees", "opec+ agreed", "масован* атак*", "удар* по енергетиц*", "графік* відключень", "аварійн* відключ*"]

# -----------------------------------------------------------
#  Джерела
#  tab:    world | ukraine | mine
#  lang:   en, de, pl тощо — заголовок перекладається українською; uk — без перекладу
#  filter: true — брати лише новини, що потрапили хоча б в одну тему
#          (для загальних видань, де багато нерелевантного)
#  Google News: будь-який пошуковий запит перетворюється на RSS,
#  так у стрічку потрапляють заголовки Reuters, Bloomberg, FT та ін.
# -----------------------------------------------------------
feeds:

  # ---------- Світ: галузеві видання ----------
  - name: OilPrice
    url: https://oilprice.com/rss/main
    tab: world
    lang: en
  - name: Rigzone
    url: https://www.rigzone.com/news/rss/rigzone_latest.aspx
    tab: world
    lang: en
  - name: Offshore Energy
    url: https://www.offshore-energy.biz/feed/
    tab: world
    lang: en
  - name: Energy Voice
    url: https://www.energyvoice.com/feed/
    tab: world
    lang: en
  - name: pv magazine
    url: https://www.pv-magazine.com/feed/
    tab: world
    lang: en
  - name: CleanTechnica
    url: https://cleantechnica.com/feed/
    tab: world
    lang: en
    filter: true
  - name: gCaptain
    url: https://gcaptain.com/feed/
    tab: world
    lang: en
  - name: Splash247
    url: https://splash247.com/feed/
    tab: world
    lang: en
  - name: FreightWaves
