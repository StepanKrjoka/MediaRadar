  - name: "Google News: нафта й пальне"
    url: "https://news.google.com/rss/search?q=(oil+OR+crude+OR+diesel+OR+OPEC)+when:1d&hl=en-US&gl=US&ceid=US:en"
    tab: world
    lang: en
  - name: "Google News: газ і LNG"
    url: "https://news.google.com/rss/search?q=(LNG+OR+%22natural+gas%22+OR+TTF)+when:1d&hl=en-US&gl=US&ceid=US:en"
    tab: world
    lang: en
  - name: "Google News: електроенергія й ВДЕ"
    url: "https://news.google.com/rss/search?q=(%22power+prices%22+OR+%22power+grid%22+OR+solar+OR+%22wind+power%22)+when:1d&hl=en-US&gl=US&ceid=US:en"
    tab: world
    lang: en
  - name: "Google News: судноплавство й фрахт"
    url: "https://news.google.com/rss/search?q=(shipping+OR+freight+OR+tanker+OR+%22container+rates%22)+when:1d&hl=en-US&gl=US&ceid=US:en"
    tab: world
    lang: en
  - name: "Google News: Україна — енергетика (англ.)"
