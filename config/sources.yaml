# ===========================================================
#  MediaRadar — налаштування
#  Вкладки: Усі новини Україна · Важливе · В тренді Google · Європа · Світ
#  Новина може бути в кількох вкладках одночасно.
#
#  Як писати ключові слова:
#    «нафт*»  — корінь: нафта, нафтовий, нафтогаз…
#    «oil»    — ціле слово: не спрацює на «soil»
#    «оператор гтс» — фраза
#  Теми визначаються за українським перекладом заголовка,
#  тож іноземні видання (німецькі, польські тощо) фільтруються так само.
# ===========================================================

retention_hours: 72          # скільки тримати новини у стрічці
trends_history_days: 7       # скільки тримати тренди Google

# ---------- Що означає «стосується України» ----------
ukraine:
  keywords: [
    "україн*", "київ*", "києв*", ukrain*, kyiv*, kiev,
    "нафтогаз*", naftogaz, "укрнафт*", ukrnafta, "укртатнафт*", ukrtatnafta,
    "оператор гтс", "огтсу", gtsou, "gas tso of ukraine",
    "укренерго", ukrenergo, "енергоатом*", energoatom, "укргідроенерго", ukrhydroenergo,
    "центренерго", centrenergo, "дтек", dtek, "окко", okko, wog, upg, "socar україна",
    "метінвест*", metinvest, "інтерпайп*", interpipe,
    "арселорміттал кривий ріг", "arcelormittal kryvyi rih", "кривий ріг", "кривого рогу", "kryvyi rih",
    ferrexpo, "феррекспо", "кернел*", "kernel holding", "мхп", mhp, "нібулон*", nibulon,
    "укрзалізниц*", ukrzaliznytsia, "укрпошт*", ukrposhta, "нова пошта", "нової пошти", "nova poshta", "nova post",
    "нкрекп", neurc, "міненерго", "укрпорт*", "ампу", uspa
  ]
  # Видання з України: їхні новини вважаються українськими,
  # якщо в них не йдеться явно про інші країни (див. foreign нижче)

# ---------- Що означає «про Європу» ----------
europe:
  keywords: [
    "європ*", "єс", "євросоюз*", "єврокоміс*", "європарламент*", "єврозон*", "єцб", "брюссел*",
    europe*, eu, "european commission", brussels, eurozone, ecb,
    ttf, ets, cbam, repowereu, "entso*", acer,
    "польщ*", "польськ*", poland, polish, "німеччин*", "німецьк*", germany, german,
    "франці*", "французьк*", france, french, "італі*", "італійськ*", italy, italian,
    "іспані*", "іспанськ*", spain, spanish, "угорщин*", "угорськ*", hungary, hungarian,
    "словаччин*", "словацьк*", slovakia, slovak, "румуні*", "румунськ*", romania, romanian,
    "молдов*", moldova, "чехі*", "чеськ*", czech*, "австрі*", "австрійськ*", austria*,
    "нідерланд*", netherlands, dutch, "бельгі*", belgium, "норвегі*", "норвезьк*", norway, norwegian,
    "литв*", lithuania*, "латві*", latvia*, "естоні*", estonia*, "болгар*", bulgaria*,
    "греці*", "грецьк*", greece, greek, "хорвати*", croatia*, "словені*", slovenia*,
    "данія", "данії", "данську", "данськ*", denmark, danish, "швеці*", "шведськ*", sweden, swedish,
    "фінлянд*", "фінськ*", finland, finnish, "британі*", "британськ*", britain, british, uk,
    "ірланді*", ireland, "португалі*", portugal,
    orlen, mol, omv, rwe, uniper, equinor, engie, edf, enel, iberdrola, totalenergies, eni, repsol,
    pge, "gaz-system", eustream, transgaz, cez, vattenfall, "ørsted", orsted, "siemens energy",
    thyssenkrupp, maersk, "deutsche bahn"
  ]

# ---------- Ознаки іноземної тематики ----------
# Новина українського видання, де йдеться про інші країни і немає згадки України,
# йде у «Світ» (і в «Європу», якщо про Європу), а не в «Україну».
foreign:
  keywords: [
    "сша", "американськ*", "китай", "китаю", "китаї", "китайськ*", "індія", "індії", "індійськ*",
    "японі*", "японськ*", "саудівськ*", "оае", "катар*", "іран*", "ізраїл*", "туреччин*", "турецьк*",
    "росі*", "російськ*", "рф", "казахстан*", "азербайджан*", "бразилі*", "канад*", "австралі*",
    "опек*", "brent", "wti", "фрс", "уолл-стріт*", "волл-стріт*", "nasdaq", "s&p",
    usa, "united states", america*, china, chinese, india, indian, japan*, saudi, iran*, israel*,
    turkey, turkish, russia*, opec*, fed, "wall street"
  ]

# ---------- Теми (фільтр «За темами») ----------
topics:
  - id: oil
    title: Нафта і пальне
    keywords: [oil, crude, brent, wti, diesel, gasoline, petrol, "jet fuel", fuel*, refin*, opec*, "нафт*", "пальн*", "паливн*", "палив*", "бензин*", "дизел*", "азс", "нпз", "автогаз*", "скраплен*", "мазут*", "керосин*"]
  - id: gas
    title: Газ
    keywords: [gas, lng, ttf, "henry hub", pipeline*, "газ", "газу", "газом", "газі", "газов*", "газопровід*", "газопровод*", "зпг", "пхг", "гтс", "транзит*"]
  - id: power
    title: Електроенергія
    keywords: [electricity, "power grid", "power price*", "power market", "power plant*", nuclear, coal, utility, utilities, blackout*, outage*, "power cut*", "power supply", "energy infrastructure", "energy sector", "електроенерг*", "електрик*", "енергосистем*", "енергоблок*", "електростанці*", "аес", "тес", "тец", "гес", "атомн*", "вугілл*", "відключен*", "генерац*", "рдн", "енергетик*", "енергопостач*", "енергоринк*"]
  - id: renewables
    title: ВДЕ і накопичення
    keywords: [solar, "wind farm*", "wind power", "offshore wind", renewable*, "battery storage", bess, hydrogen, biomethane, photovoltaic, "сонячн*", "вітров*", "вітроелектр*", "вде", "відновлюван*", "накопичувач*", "воднев*", "водень", "водню", "біометан*", "біогаз*", "зелен* тариф*", "гарантован* покуп*", "сес", "вес"]
  - id: logistics
    title: Логістика
    keywords: [shipping, freight, container*, tanker*, port, ports, rail*, trucking, logistics, "supply chain", "red sea", suez, "black sea", airline*, airport*, aviation, "порт", "порту", "порти", "портів", "портах", "логіст*", "вантаж*", "залізниц*", "фрахт*", "контейнер*", "коридор*", "пункт* пропуску", "перевез*", "перевізник*", "суден", "судна", "суднопл*", "танкер*", "авіа*", "аеропорт*", "кордон*"]
  - id: industry
    title: Промисловість
    keywords: [steel, metallurg*, "iron ore", mining, manufactur*, chemical*, fertili*, aluminium, aluminum, automaker*, "car maker*", "металург*", "сталь", "сталі", "сталев*", "руд*", "гмк", "шахт*", "завод*", "виробництв*", "промислов*", "хімі*", "добрив*", "фероспла*", "цемент*", "автовиробн*", "автопром*", "машинобуд*", "гірничо*"]

# ---------- Виключення ----------
# Новини з цими словами не потрапляють у жодну тему (захист від хибних збігів:
# «Шахтар» — футбол, а не шахти).
exclude: ["футбол*", "футбольн*", "динамо", "шахтар", "шахтаря", "шахтарем", "матч*", "чемпіонат*", "уєфа", "ліга чемпіонів", "ліга європи", "football", "soccer", "premier league", "champions league", "shakhtar", "dynamo"]

# ---------- «Важливе» ----------
# Новина про Україну, яку дали 2+ видання одночасно,
# або в заголовку є маркери терміновості.
important:
  min_sources: 2
  keywords: [breaking, exclusive, urgent, "терміново", "блискавка", "ексклюзив*", "масован* атак*", "удар* по енергетиц*", "графік* відключень", "аварійн* відключ*", "санкці*"]

# ---------- Вкладка «В тренді Google» ----------
google:
  trends_rss: "https://trends.google.com/trending/rss?geo=UA"
  news_rss:
    - "https://news.google.com/rss?hl=uk&gl=UA&ceid=UA:uk"
    - "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=uk&gl=UA&ceid=UA:uk"

# ---------- Резервний пошук Google News ----------
# Для видань без RSS (або коли RSS впав) збирач бере заголовки з Google News
# за доменом видання. Для великих англомовних медіа до запиту додаються
# ключові слова тем (gn_terms: en), щоб не тягнути всю стрічку.
gn_terms:
  en: "(oil OR gas OR LNG OR fuel OR energy OR power OR electricity OR coal OR nuclear OR solar OR shipping OR freight OR port OR rail OR steel OR mining OR OPEC OR Ukraine)"

# ===========================================================
#  Джерела
#    name    — назва у стрічці
#    site    — домен (для резервного пошуку в Google News)
